[fsrmamba]
enable=1
weights=fsrmamba_weights.bin
toggle_key=0xDD
; preset_key uses a VK_ name or decimal/hex number; 0xDB is '[' (VK_OEM_4)
; presets cycle with preset_key; unspecified values come from the ini
; editing any ini content resets the active preset; unchanged reloads keep it
preset_key=0xDB
preset1=stabilize=0,foliage_strength=0,fallback_strength=0
preset2=foliage_strength=1
preset3=foliage_strength=1,fallback_strength=0.5
preset4=foliage_strength=1,fallback_strength=0.5,foliage_history_scale=0.75
preset5=stabilize=0.85,stabilize_tau=1.0,foliage_strength=0
log=1
debug_view=0
exposure_mode=fsr
ring_frames=8
; live KPN anti-flicker: strength 0..0.95 (0 bypass), contrast threshold 0.05..4, floor 0.0001..0.1
stabilize=0.85
stabilize_tau=1.0
stabilize_eps=0.004
; experimental KPN foliage/fallback, live; both strengths 0 bypass all new arithmetic
; zero tuning values with positive lower bounds select the documented starts; spatial=0 disables prefilter
foliage_strength=0
foliage_ema=0
foliage_threshold=0
foliage_eps=0
foliage_spatial=0
foliage_history_scale=0
foliage_alpha_floor=0
fallback_strength=0
fallback_sigma=0
fallback_alpha=0
; first-run diagnosis options
require_known_fsr2=1
jitter_flip_x=1
jitter_flip_y=1
mv_flip_x=0
mv_flip_y=0
depth_to_space_alt=0
; debug_view: 0 normal, 1 base only (Lanczos/nearest, no history), 2 reprojected history only
